services:
  postgres:
    image: postgres:16
    container_name: clob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clob}
      POSTGRES_DB: ${POSTGRES_DB:-clob}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clob} -d ${POSTGRES_DB:-clob}"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clob-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Engine connects to Postgres and runs CREATE TABLE IF NOT EXISTS on startup.
      # No separate migration step needed.
      DATABASE_URL: ${DATABASE_URL:-postgres://clob:clob@postgres:5432/clob}
      # Admin key for privileged endpoints — set a real secret in production.
      ADMIN_KEY: ${ADMIN_KEY:-changeme}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pg_data:
